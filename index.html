<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 0;
  }
  .iframe-container {
    width: 100vw;
    height: 100vh;
    overflow: hidden; /* Menyembunyikan elemen yang keluar dari kotak */
  }
  .iframe-container iframe {
    width: 100%;
    height: calc(100% + 40px); /* Tambah tinggi untuk mengkompensasi margin atas */
    margin-top: -40px; /* Tarik iframe ke atas untuk menyembunyikan banner */
    border: none;
  }
</style>
</head>
<body>

<div class="iframe-container">
  <iframe src="https://script.google.com/macros/library/d/1Hsppl-pVWE8KaA0SBn56easUkadRD15dGqaIJYhVpmcaqxHvKWkH3KLF/5"></iframe>
</div>

</body>
</html>
